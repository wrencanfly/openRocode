name = "pick_object"
description = "Optional L3 policy plugin: closed-loop learned grasp policy worker over Unix Domain Socket."
kind = "policy_plugin"
rate_hz = 50
heartbeat_timeout_ms = 80
timeout_sec = 10.0
max_retries = 1

[preconditions]
require_gripper_open = true
max_base_distance_m = 0.90

[worker]
program = "python3"
args = ["python/examples/mock_policy_worker.py"]
