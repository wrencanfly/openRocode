[project]
name = "openrocode"
version = "0.2.0.dev0"
description = "Robot control as 3D computer use: models point at camera images, the harness does the geometry"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
sim = ["mujoco>=3.2", "numpy>=1.26", "pillow>=10"]
agent = ["anthropic>=0.70"]
openai = ["openai>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
rocode = "rocode.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rocode", "openrocode_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
